<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安念堂 · 一灯一念</title><link rel="icon" type="image/png" sizes="256x256" href="assets/annian-favicon.png?v=1"><link rel="stylesheet" href="lantern.css"><script defer src="vendor/three-glass.min.js"></script><script defer src="vendor/OrbitControls.js"></script><script defer src="glass-lamp.js?v=35"></script></head><body>
<link rel="stylesheet" href="lantern-immersive.css?v=15">
<main class="studio"><section class="stage"><div id="viewport" aria-label="可拖动旋转的三维灯罩"></div><button id="backToTributes" class="memorial-back" type="button" hidden>← 返回祭奠记录</button><div class="stage-toolbar"><button id="rotate" aria-pressed="false">自动旋转</button><button id="light" aria-pressed="true">熄灯</button></div><p class="hint">拖动旋转 · 固定观察距离</p><p id="status" role="status" hidden></p></section><form id="memorialWishForm" class="memorial-wish-form" hidden><label for="memorialWish">寄语故人</label><input id="memorialWish" maxlength="40" placeholder="写下想对她说的话（最多40字）" required><button type="submit">送至留言板</button></form>
<aside><section class="single-style"><h2 id="styleName">琥珀玻璃灯</h2><p id="styleDescription">琥珀曲腹 · 清透暖光</p></section><section><h2>玻璃罩样式</h2><div class="styles" aria-label="选择玻璃罩样式"><button type="button" data-shade="amber" aria-label="样式1：琥珀玻璃">1</button><button type="button" data-shade="smoke" aria-label="样式2：旋纹水晶">2</button><button type="button" data-shade="hammered" aria-label="样式3：切面水晶">3</button><button type="button" data-shade="lattice" aria-label="样式4：素面琉璃">4</button><button type="button" data-shade="cloud" aria-label="样式5：柔雾磨砂">5</button></div></section><section><h2>玻璃与烛光</h2><div class="fields"><label>玻璃颜色<input id="shadeColor" type="color" value="#ffffff"></label></div><label class="slider">烛光亮度 <output id="brightnessOut"></output><input id="brightness" type="range" min="0.2" max="1" step="0.05" value="1"></label></section>
<section><h2>自定义灯座</h2><div id="bases" class="segments"><button data-base="round">圆台</button><button data-base="hex">六角</button><button data-base="lotus">莲瓣</button><button data-base="tall">高脚</button></div><label class="slider">灯座大小 <output id="baseSizeOut"></output><input id="baseSize" type="range" min="0.7" max="1.4" step="0.05" value="1"></label><label class="slider">灯座高度 <output id="baseHeightOut"></output><input id="baseHeight" type="range" min="0.7" max="1.6" step="0.05" value="1"></label></section>
<section><h2>寄语故人</h2><input id="wish" maxlength="40" placeholder="写下一句思念（最多40字）" aria-label="纪念寄语"><div class="actions"><button id="save">保存这盏灯</button><button id="reset">恢复默认</button></div><p class="save-note">保存在当前浏览器，下次打开可继续修改。</p></section></aside></main><p id="wishDisplay" class="wish"></p><div id="lampConfirm" class="lamp-confirm" hidden><section role="dialog" aria-modal="true" aria-labelledby="lampConfirmTitle"><button id="lampConfirmClose" class="lamp-confirm-close" type="button" aria-label="关闭">×</button><div class="lamp-confirm-icon"><img src="assets/lamp-symbol.png?v=1" alt=""></div><h2 id="lampConfirmTitle">已点灯</h2><p>愿这一盏长明灯，照亮她安息的路，也寄托长久的思念。</p><button id="lampConfirmOk" class="lamp-confirm-ok" type="button">确定</button></section></div></body></html>
