<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <base href="./" />
    <style>
      body {
        background-color: #000;
        margin: 0;
      }
      #webgl {
        pointer-events: none;
      }
      #ui-app {
        width: 100%;
        height: 100%;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
      }
      #ui {
        position: absolute;
        overflow: hidden;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
      }
      #monitor-videos {
        pointer-events: none;
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
        top: 0;
        left: 0;
      }
      #css {
        cursor: pointer;
      }
      #ui-interactive {
        position: absolute;
        top: 0;
        left: 0;
        width: 256px;
      }
      video {
        position: absolute;
        top: 0;
        pointer-events: none;
      }
    </style>
    <title>Henry Heffernan - Portfolio 2022</title>
    <meta name="title" content="Henry Heffernan - Software Engineer" />
    <meta
      name="description"
      content="I'm Henry, a Software Engineer based in NY. Rensselaer Polytechnic Institute Graduate with my B.S. in Computer Science, currently looking for a full time role."
    />
    <link rel="shortcut icon" href="ffbcd8e4fac59356.ico" type="image/x-icon" />
    <script>
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        window.persistentCacheReady = navigator.serviceWorker
          .register("./sw.js?v=20261005-1", { scope: "./", updateViaCache: "none" })
          .catch((error) => console.warn("Persistent asset cache unavailable", error));
      }
    </script>
    <script defer src="retro-workstation.js?v=20261005-15"></script>
    <script defer src="bundle.retro-workstation.js?v=20261005-1"></script>
    <link href="main.css?v=20261005-5" rel="stylesheet" />
    <script src="desktop/asset-pack.js?v=20261005-4"></script>
  
  </head>
  <body class="pixel-loading">
    <div id="css"></div>
    <div id="webgl"></div>
    <div id="overlay"></div>
    <div id="ui-interactive"></div>
    <div id="ui"></div>
    <div id="custom-pixel-loader" role="status" aria-live="polite" aria-label="加载中">
      <div class="pixel-loader-card">
        <div class="pixel-loader-title">LOADING<span class="pixel-loader-dots" aria-hidden="true"></span></div>
        <div class="pixel-progress-frame" aria-hidden="true" hidden>
          <div class="pixel-progress-track">
            <div id="pixel-progress-fill"></div>
          </div>
        </div>
        <div id="pixel-progress-status">正在查找资源包...</div>
        <button id="pixel-pack-download" type="button" hidden>下载资源包</button>
        <button id="pixel-start-button" type="button">START</button>
      </div>
    </div>
    <div id="custom-fixed-controls" aria-label="Scene controls">
      <button id="custom-audio-control" class="custom-control" type="button" aria-label="Toggle audio"></button>
      <button id="custom-view-control" class="custom-control" type="button" aria-label="Change view"></button>
    </div>
    <div id="monitor-videos">
      <video
        id="video-1"
        muted
        loop
        autoplay
        preload="auto"
        width="0"
        height="0"
        src="c28874fa5b347023.mp4"
        style="opacity: 0"
      ></video>
      <video
        id="video-2"
        muted
        loop
        autoplay
        preload="auto"
        width="0"
        height="0"
        src="78d1c080b40532e6.mp4"
        style="opacity: 0"
      ></video>
    </div>
    <script>
      (() => {
        // The legacy interface dispatches synthetic _AUTO_ key events only to play
        // its typewriter pop. Stop those events while leaving startup/office audio intact.
        document.addEventListener("keydown", (event) => {
          if (typeof event.key === "string" && event.key.includes("_AUTO_")) {
            event.stopImmediatePropagation();
          }
        }, true);

        const loader = document.querySelector("#custom-pixel-loader");
        const fill = document.querySelector("#pixel-progress-fill");
        const progressFrame = document.querySelector(".pixel-progress-frame");
        const progressStatus = document.querySelector("#pixel-progress-status");
        const start = document.querySelector("#pixel-start-button");
        const packButton = document.querySelector("#pixel-pack-download");
        const controls = document.querySelector("#custom-fixed-controls");
        const audioControl = document.querySelector("#custom-audio-control");
        const viewControl = document.querySelector("#custom-view-control");
        const startedAt = performance.now();
        let finishing = false;
        let ready = false;
        let started = false;
        let originalStart = null;
        let muted = false;
        let freeView = false;
        let viewTransitioning = false;
        let sceneReady = false;
        let desktopPreloadReady = false;
        let desktopPreloadProgress = 0;
        let desktopLoaded = 0;
        let desktopTotal = 0;
        let desktopLoadedBytes = 0;
        let desktopTotalBytes = 0;
        let displayedProgress = 0;
        let packNeedsPermission = false;
        let packDownloading = false;
        let packReading = false;
        let packDownloadedThisVisit = false;
        let downloadProgress = 0;
        let packWaitingStatus = "正在查找资源包...";

        const tellDesktop = (type) => {
          const frame = window.retroApplication?.cssScene?.children?.[0]?.element?.querySelector("iframe");
          frame?.contentWindow?.postMessage({ type }, location.origin);
        };

        const useStoredPack = async () => {
          try {
            const saved = await window.DesktopAssetPack.storedFile();
            if (!saved || saved.version !== window.DesktopAssetPack.VERSION) throw new Error("Saved file not found");
            const permission = saved.blob ? "granted" : await saved.handle.requestPermission({ mode: "read" });
            if (permission !== "granted") throw new Error("File access was not granted");
            packNeedsPermission = false;
            packReading = true;
            packButton.hidden = true;
            progressFrame.hidden = false;
            displayedProgress = 0;
            progressStatus.textContent = "正在读取本地资源包";
            tellDesktop("desktop-pack-ready");
          } catch (error) {
            packNeedsPermission = false;
            packButton.hidden = false;
            packButton.disabled = false;
            packButton.textContent = "下载资源包";
            packWaitingStatus = "读取授权失败，请重新下载";
          }
        };

        const downloadPack = async () => {
          packWaitingStatus = "请下载资源包后继续";
          packDownloading = true;
          packReading = false;
          downloadProgress = 0;
          displayedProgress = 0;
          fill.style.width = "0%";
          progressFrame.hidden = false;
          desktopPreloadReady = false;
          desktopPreloadProgress = 0;
          desktopLoaded = 0;
          desktopTotal = 0;
          desktopLoadedBytes = 0;
          desktopTotalBytes = 0;
          sessionStorage.setItem("desktop-pack-downloading", "1");
          tellDesktop("desktop-pack-download-start");
          progressStatus.textContent = "请选择资源包保存位置";
          packButton.disabled = true;
          let handle;
          if (window.showSaveFilePicker) {
            try {
              // Invoke the picker during the click gesture, before any await.
              handle = await window.showSaveFilePicker({
                suggestedName: window.DesktopAssetPack.FILE_NAME,
                types: [{ description: "Desktop asset archive", accept: { "application/zip": [".zip"] } }]
              });
            } catch (error) {
              packWaitingStatus = error.name === "AbortError" ? "已取消下载，可重试" : "保存位置不可用，请重试";
              packButton.disabled = false;
              packDownloading = false;
              progressFrame.hidden = true;
              sessionStorage.removeItem("desktop-pack-downloading");
              return;
            }
          }
          progressStatus.textContent = "正在下载资源包 · 0%";
          let writer;
          try {
            const url = new URL(`desktop/${window.DesktopAssetPack.URL_PATH}`, location.href);
            const response = await fetch(url, { cache: "no-store" });
            if (!response.ok) throw new Error(`Archive HTTP ${response.status}`);
            if (handle) writer = await handle.createWritable();
            const chunks = [];
            const total = Number(response.headers.get("content-length")) || 20469380;
            let received = 0;
            if (response.body?.getReader) {
              const reader = response.body.getReader();
              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                if (writer) await writer.write(value);
                else chunks.push(value);
                received += value.byteLength;
                downloadProgress = Math.min(1, received / total);
              }
            } else {
              const bytes = await response.arrayBuffer();
              if (writer) await writer.write(bytes);
              else chunks.push(bytes);
              downloadProgress = 1;
            }
            if (writer) {
              await writer.close();
              writer = null;
              await window.DesktopAssetPack.rememberFile(handle);
            } else {
              const blob = new Blob(chunks, { type: "application/zip" });
              await window.DesktopAssetPack.rememberBlob(blob);
              const link = document.createElement("a");
              const objectUrl = URL.createObjectURL(blob);
              link.href = objectUrl;
              link.download = window.DesktopAssetPack.FILE_NAME;
              document.body.append(link);
              link.click();
              link.remove();
              setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);
            }
            packDownloadedThisVisit = true;
            downloadProgress = 1;
            packReading = true;
            packButton.hidden = true;
            progressStatus.textContent = "正在读取下载的资源包";
            tellDesktop("desktop-pack-ready");
          } catch (error) {
            console.warn("Asset pack download failed", error);
            await writer?.abort().catch(() => {});
            packDownloadedThisVisit = false;
            packWaitingStatus = "下载失败，请重试";
            packButton.disabled = false;
            progressFrame.hidden = true;
          } finally {
            packDownloading = false;
            sessionStorage.removeItem("desktop-pack-downloading");
            finishWhenEverythingIsReady();
          }
        };

        packButton.addEventListener("click", () => {
          if (packNeedsPermission) useStoredPack();
          else downloadPack();
        });

        const syncControlStates = () => {
          audioControl.classList.toggle("is-active", muted);
          viewControl.classList.toggle("is-active", freeView);
          audioControl.setAttribute("aria-pressed", String(muted));
          viewControl.setAttribute("aria-pressed", String(freeView));
          audioControl.setAttribute("aria-label", muted ? "Restore office ambience" : "Mute office ambience");
          viewControl.setAttribute("aria-label", freeView ? "Disable free view" : "Enable free view");
        };

        const findVisibleStart = () => {
          const button = document.querySelector(".bios-start-button");
          const modal = button?.parentElement?.parentElement?.parentElement;
          if (!button || !modal) return null;
          return Number.parseFloat(getComputedStyle(modal).opacity) > 0.95 ? button : null;
        };

        const finishLoading = (button) => {
          if (finishing) return;
          finishing = true;
          originalStart = button;
          const finishStartedAt = performance.now();
          const complete = (now) => {
            const progress = Math.min(1, (now - finishStartedAt) / 760);
            displayedProgress = 99 + progress;
            fill.style.width = `${displayedProgress}%`;
            progressStatus.textContent = progress < 1 ? "正在完成 · 99%" : "准备就绪 · 100%";
            if (progress < 1) {
              requestAnimationFrame(complete);
              return;
            }
            ready = true;
            loader.classList.add("is-ready");
          };
          requestAnimationFrame(complete);
        };

        const finishWhenEverythingIsReady = () => {
          if (!packDownloading && sceneReady && desktopPreloadReady && originalStart) finishLoading(originalStart);
        };

        window.addEventListener("message", (event) => {
          if (event.source === window || !event.data) return;
          if (event.data.type === "desktop-preload-progress") {
            packReading = true;
            packButton.hidden = true;
            progressFrame.hidden = false;
            desktopPreloadProgress = Math.max(0, Math.min(1, Number(event.data.progress) || 0));
            desktopLoaded = Math.max(0, Number(event.data.loaded) || 0);
            desktopTotal = Math.max(0, Number(event.data.total) || 0);
            desktopLoadedBytes = Math.max(0, Number(event.data.loadedBytes) || 0);
            desktopTotalBytes = Math.max(0, Number(event.data.totalBytes) || 0);
          }
          if (event.data.type === "desktop-preload-ready") {
            packReading = false;
            packButton.hidden = true;
            desktopPreloadProgress = 1;
            desktopLoaded = Math.max(0, Number(event.data.loaded) || desktopLoaded);
            desktopTotal = Math.max(0, Number(event.data.total) || desktopTotal);
            desktopLoadedBytes = Math.max(0, Number(event.data.loadedBytes) || desktopLoadedBytes);
            desktopTotalBytes = Math.max(0, Number(event.data.totalBytes) || desktopTotalBytes);
            desktopPreloadReady = true;
            finishWhenEverythingIsReady();
          }
          if (event.data.type === "desktop-pack-available") {
            if (packDownloading || packReading || desktopPreloadReady) return;
            packNeedsPermission = true;
            packButton.hidden = false;
            packButton.disabled = false;
            packButton.textContent = "允许加载";
            packWaitingStatus = "已找到资源包，请允许加载";
          }
          if (event.data.type === "desktop-pack-required") {
            if (packDownloading) return;
            packReading = false;
            packNeedsPermission = false;
            packButton.hidden = false;
            packButton.disabled = false;
            packButton.textContent = "下载资源包";
            packWaitingStatus = "未找到资源包，请下载";
            progressFrame.hidden = true;
          }
          if (event.data.type === "desktop-pack-needs-permission") {
            if (packDownloading) return;
            packReading = false;
            packNeedsPermission = true;
            packButton.hidden = false;
            packButton.disabled = false;
            packButton.textContent = "允许加载";
            packWaitingStatus = "已找到资源包，请允许加载";
            progressFrame.hidden = true;
          }
          if (event.data.type === "desktop-pack-error") {
            if (packDownloading) return;
            packReading = false;
            packNeedsPermission = false;
            packButton.hidden = false;
            packButton.disabled = false;
            packButton.textContent = "下载资源包";
            packWaitingStatus = "资源包无效，请重新下载";
            progressFrame.hidden = true;
          }
        });

        const revealControlsWhenReady = () => {
          const check = () => {
            const app = window.retroApplication;
            if (!document.querySelector("#retro-day-night") ||
                !app?.world?.audioManager?.listener ||
                !app?.camera?.orbitControls) return;
            window.clearInterval(timer);
            syncControlStates();
            document.body.classList.add("scene-controls-ready");
            controls.classList.add("is-visible");
          };
          const timer = window.setInterval(check, 100);
          check();
        };

        const revealWhenStable = () => {
          const revealStartedAt = performance.now();
          const check = (now) => {
            const screen = document.querySelector("#computer-screen");
            const screenWidth = screen?.getBoundingClientRect().width || 0;
            const stableWidth = Math.max(24, window.innerWidth * 0.016);
            if (screenWidth >= stableWidth || now - revealStartedAt > 900) {
              document.body.classList.remove("pixel-loading");
              revealControlsWhenReady();
              loader.classList.add("is-finished");
              window.setTimeout(() => loader.remove(), 420);
              return;
            }
            requestAnimationFrame(check);
          };
          requestAnimationFrame(check);
        };

        start.addEventListener("click", () => {
          if (!ready || started || !originalStart) return;
          started = true;
          loader.classList.remove("is-ready");
          loader.classList.add("is-starting");

          // Keep this click synchronous with the user's gesture so browsers may start audio.
          originalStart.click();
          revealWhenStable();
        });

        controls.addEventListener("pointerdown", (event) => event.stopPropagation());
        controls.addEventListener("mousedown", (event) => event.stopPropagation());

        audioControl.addEventListener("click", (event) => {
          event.stopPropagation();
          const audio = window.retroApplication?.world?.audioManager;
          if (!audio?.listener) return;
          muted = !muted;
          audio.listener.setMasterVolume(muted ? 0 : 1);
          audio.context?.resume();
          syncControlStates();
        });

        viewControl.addEventListener("click", (event) => {
          event.stopPropagation();
          const camera = window.retroApplication?.camera;
          if (!camera?.orbitControls || viewTransitioning) return;
          freeView = !freeView;
          viewTransitioning = true;
          if (freeView) {
            camera.transition("orbitControlsStart", 750, undefined, () => {
              camera.instance.position.copy(camera.keyframes.orbitControlsStart.position);
              camera.orbitControls.update();
              camera.freeCam = true;
              viewTransitioning = false;
            });
            document.getElementById("webgl").style.pointerEvents = "auto";
          } else {
            camera.freeCam = false;
            camera.transition("idle", 1000, undefined, () => { viewTransitioning = false; });
            document.getElementById("webgl").style.pointerEvents = "none";
          }
          syncControlStates();
        });

        window.setInterval(() => {
          // The hidden legacy UI can mount later and reset these settings once.
          const app = window.retroApplication;
          if (muted) app?.world?.audioManager?.listener?.setMasterVolume(0);
          if (freeView && !viewTransitioning && app?.camera && !app.camera.freeCam) {
            viewTransitioning = true;
            app.camera.transition("orbitControlsStart", 750, undefined, () => {
              app.camera.instance.position.copy(app.camera.keyframes.orbitControlsStart.position);
              app.camera.orbitControls.update();
              app.camera.freeCam = true;
              viewTransitioning = false;
            });
            document.getElementById("webgl").style.pointerEvents = "auto";
          }
        }, 200);

        const update = (now) => {
          if (finishing) return;
          const elapsed = now - startedAt;
          const startButton = findVisibleStart();
          if (startButton && elapsed > 1200) {
            sceneReady = true;
            originalStart = startButton;
            finishWhenEverythingIsReady();
          }
          // Show progress only after the player chooses to load or download.
          // The scene is initialized in parallel but never advances a timer-based bar.
          const sceneProgress = sceneReady ? 20 : 0;
          const assetProgress = packDownloading ? downloadProgress * 60
            : packDownloadedThisVisit ? 60 + desktopPreloadProgress * 20
            : desktopPreloadProgress * 80;
          const targetProgress = Math.min(98, sceneProgress + assetProgress);
          displayedProgress += (targetProgress - displayedProgress) * .075;
          if (targetProgress - displayedProgress < .03) displayedProgress = targetProgress;
          fill.style.width = `${Math.max(1, displayedProgress)}%`;
          const percent = Math.floor(Math.max(1, displayedProgress));
          if (packDownloading) {
            progressStatus.textContent = `正在下载资源包 · ${Math.floor(downloadProgress * 100)}%`;
          } else if (packNeedsPermission || (!packReading && !desktopPreloadReady)) {
            progressStatus.textContent = packWaitingStatus;
          } else if (!desktopPreloadReady) {
            const bytes = desktopTotalBytes
              ? ` ${(desktopLoadedBytes / 1048576).toFixed(1)}/${(desktopTotalBytes / 1048576).toFixed(1)} 兆`
              : desktopTotal ? ` ${desktopLoaded}/${desktopTotal}` : "";
            progressStatus.textContent = `正在读取资源包${bytes} · ${percent}%`;
          } else if (!sceneReady) {
            progressStatus.textContent = `正在初始化场景 · ${percent}%`;
          } else {
            progressStatus.textContent = `正在准备桌面 · ${percent}%`;
          }
          requestAnimationFrame(update);
        };

        requestAnimationFrame(update);
      })();
    </script>
  </body>
</html>
