<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <base href="./" />
    <style>
      body {
        background-color: #000;
        margin: 0;
      }
      #webgl {
        pointer-events: none;
      }
      #ui-app {
        width: 100%;
        height: 100%;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
      }
      #ui {
        position: absolute;
        overflow: hidden;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
      }
      #monitor-videos {
        pointer-events: none;
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
        top: 0;
        left: 0;
      }
      #css {
        cursor: pointer;
      }
      #ui-interactive {
        position: absolute;
        top: 0;
        left: 0;
        width: 256px;
      }
      video {
        position: absolute;
        top: 0;
        pointer-events: none;
      }
    </style>
    <title>Henry Heffernan - Portfolio 2022</title>
    <meta name="title" content="Henry Heffernan - Software Engineer" />
    <meta
      name="description"
      content="I'm Henry, a Software Engineer based in NY. Rensselaer Polytechnic Institute Graduate with my B.S. in Computer Science, currently looking for a full time role."
    />
    <link rel="shortcut icon" href="ffbcd8e4fac59356.ico" type="image/x-icon" />
    <script>
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        window.persistentCacheReady = navigator.serviceWorker
          .register("./sw.js?v=20260926-1", { scope: "./", updateViaCache: "none" })
          .catch((error) => console.warn("Persistent asset cache unavailable", error));
      }
    </script>
    <script defer src="retro-workstation.js?v=20260926-8"></script>
    <script defer src="bundle.retro-workstation.js?v=20260920-1"></script>
    <link href="main.css?v=20261001-1" rel="stylesheet" />
  
  </head>
  <body class="pixel-loading">
    <div id="css"></div>
    <div id="webgl"></div>
    <div id="overlay"></div>
    <div id="ui-interactive"></div>
    <div id="ui"></div>
    <div id="custom-pixel-loader" role="status" aria-live="polite" aria-label="Loading">
      <div class="pixel-loader-card">
        <div class="pixel-loader-title">LOADING<span class="pixel-loader-dots" aria-hidden="true"></span></div>
        <div class="pixel-progress-frame" aria-hidden="true">
          <div class="pixel-progress-track">
            <div id="pixel-progress-fill"></div>
          </div>
        </div>
        <div id="pixel-progress-status">INITIALIZING SCENE · 0%</div>
        <button id="pixel-start-button" type="button">START</button>
      </div>
    </div>
    <div id="custom-fixed-controls" aria-label="Scene controls">
      <button id="custom-audio-control" class="custom-control" type="button" aria-label="Toggle audio"></button>
      <button id="custom-view-control" class="custom-control" type="button" aria-label="Change view"></button>
    </div>
    <div id="monitor-videos">
      <video
        id="video-1"
        muted
        loop
        autoplay
        preload="auto"
        width="0"
        height="0"
        src="c28874fa5b347023.mp4"
        style="opacity: 0"
      ></video>
      <video
        id="video-2"
        muted
        loop
        autoplay
        preload="auto"
        width="0"
        height="0"
        src="78d1c080b40532e6.mp4"
        style="opacity: 0"
      ></video>
    </div>
    <script>
      (() => {
        // The legacy interface dispatches synthetic _AUTO_ key events only to play
        // its typewriter pop. Stop those events while leaving startup/office audio intact.
        document.addEventListener("keydown", (event) => {
          if (typeof event.key === "string" && event.key.includes("_AUTO_")) {
            event.stopImmediatePropagation();
          }
        }, true);

        const loader = document.querySelector("#custom-pixel-loader");
        const fill = document.querySelector("#pixel-progress-fill");
        const progressStatus = document.querySelector("#pixel-progress-status");
        const start = document.querySelector("#pixel-start-button");
        const controls = document.querySelector("#custom-fixed-controls");
        const audioControl = document.querySelector("#custom-audio-control");
        const viewControl = document.querySelector("#custom-view-control");
        const startedAt = performance.now();
        let finishing = false;
        let ready = false;
        let started = false;
        let originalStart = null;
        let muted = false;
        let freeView = false;
        let viewTransitioning = false;
        let sceneReady = false;
        let desktopPreloadReady = false;
        let desktopPreloadProgress = 0;
        let desktopLoaded = 0;
        let desktopTotal = 0;
        let desktopLoadedBytes = 0;
        let desktopTotalBytes = 0;
        let displayedProgress = 0;

        const syncControlStates = () => {
          audioControl.classList.toggle("is-active", muted);
          viewControl.classList.toggle("is-active", freeView);
          audioControl.setAttribute("aria-pressed", String(muted));
          viewControl.setAttribute("aria-pressed", String(freeView));
          audioControl.setAttribute("aria-label", muted ? "Restore office ambience" : "Mute office ambience");
          viewControl.setAttribute("aria-label", freeView ? "Disable free view" : "Enable free view");
        };

        const findVisibleStart = () => {
          const button = document.querySelector(".bios-start-button");
          const modal = button?.parentElement?.parentElement?.parentElement;
          if (!button || !modal) return null;
          return Number.parseFloat(getComputedStyle(modal).opacity) > 0.95 ? button : null;
        };

        const finishLoading = (button) => {
          if (finishing) return;
          finishing = true;
          originalStart = button;
          const finishStartedAt = performance.now();
          const complete = (now) => {
            const progress = Math.min(1, (now - finishStartedAt) / 760);
            displayedProgress = 99 + progress;
            fill.style.width = `${displayedProgress}%`;
            progressStatus.textContent = progress < 1 ? "FINALIZING · 99%" : "READY · 100%";
            if (progress < 1) {
              requestAnimationFrame(complete);
              return;
            }
            ready = true;
            loader.classList.add("is-ready");
          };
          requestAnimationFrame(complete);
        };

        const finishWhenEverythingIsReady = () => {
          if (sceneReady && desktopPreloadReady && originalStart) finishLoading(originalStart);
        };

        window.addEventListener("message", (event) => {
          if (event.source === window || !event.data) return;
          if (event.data.type === "desktop-preload-progress") {
            desktopPreloadProgress = Math.max(0, Math.min(1, Number(event.data.progress) || 0));
            desktopLoaded = Math.max(0, Number(event.data.loaded) || 0);
            desktopTotal = Math.max(0, Number(event.data.total) || 0);
            desktopLoadedBytes = Math.max(0, Number(event.data.loadedBytes) || 0);
            desktopTotalBytes = Math.max(0, Number(event.data.totalBytes) || 0);
          }
          if (event.data.type === "desktop-preload-ready") {
            desktopPreloadProgress = 1;
            desktopLoaded = Math.max(0, Number(event.data.loaded) || desktopLoaded);
            desktopTotal = Math.max(0, Number(event.data.total) || desktopTotal);
            desktopLoadedBytes = Math.max(0, Number(event.data.loadedBytes) || desktopLoadedBytes);
            desktopTotalBytes = Math.max(0, Number(event.data.totalBytes) || desktopTotalBytes);
            desktopPreloadReady = true;
            finishWhenEverythingIsReady();
          }
        });

        const revealControlsWhenReady = () => {
          const check = () => {
            const app = window.retroApplication;
            if (!document.querySelector("#retro-day-night") ||
                !app?.world?.audioManager?.listener ||
                !app?.camera?.orbitControls) return;
            window.clearInterval(timer);
            syncControlStates();
            document.body.classList.add("scene-controls-ready");
            controls.classList.add("is-visible");
          };
          const timer = window.setInterval(check, 100);
          check();
        };

        const revealWhenStable = () => {
          const revealStartedAt = performance.now();
          const check = (now) => {
            const screen = document.querySelector("#computer-screen");
            const screenWidth = screen?.getBoundingClientRect().width || 0;
            const stableWidth = Math.max(24, window.innerWidth * 0.016);
            if (screenWidth >= stableWidth || now - revealStartedAt > 900) {
              document.body.classList.remove("pixel-loading");
              revealControlsWhenReady();
              loader.classList.add("is-finished");
              window.setTimeout(() => loader.remove(), 420);
              return;
            }
            requestAnimationFrame(check);
          };
          requestAnimationFrame(check);
        };

        start.addEventListener("click", () => {
          if (!ready || started || !originalStart) return;
          started = true;
          loader.classList.remove("is-ready");
          loader.classList.add("is-starting");

          // Keep this click synchronous with the user's gesture so browsers may start audio.
          originalStart.click();
          revealWhenStable();
        });

        controls.addEventListener("pointerdown", (event) => event.stopPropagation());
        controls.addEventListener("mousedown", (event) => event.stopPropagation());

        audioControl.addEventListener("click", (event) => {
          event.stopPropagation();
          const audio = window.retroApplication?.world?.audioManager;
          if (!audio?.listener) return;
          muted = !muted;
          audio.listener.setMasterVolume(muted ? 0 : 1);
          audio.context?.resume();
          syncControlStates();
        });

        viewControl.addEventListener("click", (event) => {
          event.stopPropagation();
          const camera = window.retroApplication?.camera;
          if (!camera?.orbitControls || viewTransitioning) return;
          freeView = !freeView;
          viewTransitioning = true;
          if (freeView) {
            camera.transition("orbitControlsStart", 750, undefined, () => {
              camera.instance.position.copy(camera.keyframes.orbitControlsStart.position);
              camera.orbitControls.update();
              camera.freeCam = true;
              viewTransitioning = false;
            });
            document.getElementById("webgl").style.pointerEvents = "auto";
          } else {
            camera.freeCam = false;
            camera.transition("idle", 1000, undefined, () => { viewTransitioning = false; });
            document.getElementById("webgl").style.pointerEvents = "none";
          }
          syncControlStates();
        });

        window.setInterval(() => {
          // The hidden legacy UI can mount later and reset these settings once.
          const app = window.retroApplication;
          if (muted) app?.world?.audioManager?.listener?.setMasterVolume(0);
          if (freeView && !viewTransitioning && app?.camera && !app.camera.freeCam) {
            viewTransitioning = true;
            app.camera.transition("orbitControlsStart", 750, undefined, () => {
              app.camera.instance.position.copy(app.camera.keyframes.orbitControlsStart.position);
              app.camera.orbitControls.update();
              app.camera.freeCam = true;
              viewTransitioning = false;
            });
            document.getElementById("webgl").style.pointerEvents = "auto";
          }
        }, 200);

        const update = (now) => {
          if (finishing) return;
          const elapsed = now - startedAt;
          const startButton = findVisibleStart();
          if (startButton && elapsed > 1200) {
            sceneReady = true;
            originalStart = startButton;
            finishWhenEverythingIsReady();
          }
          // Scene setup and desktop assets advance independently. Keeping both
          // visible prevents a long, unexplained pause at the end of the bar.
          const timedSceneProgress = 58 * (1 - Math.exp(-elapsed / 2600));
          const sceneProgress = sceneReady ? 58 : Math.min(57.5, timedSceneProgress);
          const assetProgress = desktopPreloadProgress * 40;
          const targetProgress = Math.min(98, sceneProgress + assetProgress);
          displayedProgress += (targetProgress - displayedProgress) * .075;
          if (targetProgress - displayedProgress < .03) displayedProgress = targetProgress;
          fill.style.width = `${Math.max(1, displayedProgress)}%`;
          const percent = Math.floor(Math.max(1, displayedProgress));
          if (!sceneReady) {
            progressStatus.textContent = desktopPreloadProgress > 0
              ? `LOADING SCENE & ASSETS · ${percent}%`
              : `INITIALIZING SCENE · ${percent}%`;
          } else if (!desktopPreloadReady) {
            const bytes = desktopTotalBytes
              ? ` ${(desktopLoadedBytes / 1048576).toFixed(1)}/${(desktopTotalBytes / 1048576).toFixed(1)} MB`
              : desktopTotal ? ` ${desktopLoaded}/${desktopTotal}` : "";
            progressStatus.textContent = `LOADING DESKTOP ASSETS${bytes} · ${percent}%`;
          } else {
            progressStatus.textContent = `PREPARING DESKTOP · ${percent}%`;
          }
          requestAnimationFrame(update);
        };

        requestAnimationFrame(update);
      })();
    </script>
  </body>
</html>
